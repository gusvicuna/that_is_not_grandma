name: Tests

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-tests:
    name: EditMode domain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CI/DomainTests/DomainTests.csproj

      - name: Test
        run: >
          dotnet test CI/DomainTests/DomainTests.csproj
          --no-restore
          --logger "trx;LogFileName=domain-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
